name: Deploy

on:
  push:
    tags:
      - "v*.*.*"         # 触发：git tag v1.2.3 && git push --tags
  workflow_dispatch:     # 手动触发
    inputs:
      environment:
        description: "部署环境"
        required: true
        default: "prod"
        type: choice
        options: ["prod", "staging"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/kg-rag

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend_tag:  ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}
      version:      ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "value=${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()

    steps:
      - name: Send WeChat Work notification
        if: ${{ vars.WECOM_WEBHOOK != '' }}
        run: |
          STATUS="${{ needs.build-and-push.result }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          curl -s -X POST "${{ vars.WECOM_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$EMOJI KG-RAG ${{ needs.build-and-push.outputs.version }} 构建 $STATUS\n触发: ${{ github.actor }}\n提交: ${{ github.sha }}\"}}"
