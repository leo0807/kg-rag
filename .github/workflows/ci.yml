name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 后端 ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src/ --output-format=github

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports --no-error-summary
        continue-on-error: true   # 逐步收紧，暂不阻断

      - name: Unit tests
        run: pytest tests/unit/ -q --tb=short
        if: hashFiles('backend/tests/unit/**') != ''

      - name: Build Docker image (smoke test)
        run: docker build -t kg-rag-backend:ci .

  # ── 前端 ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc --noEmit
        continue-on-error: true   # 逐步收紧

      - name: Lint (Next.js ESLint)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── 配置校验 ──────────────────────────────────────────────────────────
  config-check:
    name: Config & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Check .env.example completeness
        run: |
          python3 scripts/check-env.py .env.example || true

      - name: Shell script syntax check
        run: |
          for f in scripts/*.sh; do bash -n "$f" && echo "OK: $f"; done
