version: "3.9"

# ─────────────────────────────────────────────────────────────
# 生产应用层
# 用法：bash scripts/prod.sh
#   等价于：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 依赖：根目录下必须存在 .env 文件（参考 .env.example）
# 域名：cps.comac.cc（前端 + API）/ langfuse.cps.comac.cc（可观测性）
# ─────────────────────────────────────────────────────────────

services:
  # ── Nginx 反向代理 ─────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: aviation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Let's Encrypt 证书（使用 certbot 时启用）：
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
      - langfuse
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── 后端 API ──────────────────────────────
  backend:
    build: ./backend
    container_name: aviation-backend
    restart: unless-stopped
    stop_grace_period: 40s
    # 生产环境不对外暴露端口，由 nginx 代理
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: aviation123
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      REDIS_URL: redis://redis:6379/0
      LANGFUSE_HOST: http://langfuse:3000
      APP_VERSION: 1.0.0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_PUBLIC_URL: https://cps.comac.cc/storage
      DATABASE_URL: postgresql+asyncpg://aviation:aviation123@app-db:5432/aviation
      ES_URL: http://elasticsearch:9200
      # 告知应用处于 HTTPS 反向代理后面
      FORWARDED_ALLOW_IPS: "*"
      PROXY_HEADERS: "true"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  # ── Celery Worker ─────────────────────────
  celery-worker:
    build: ./backend
    container_name: aviation-celery-worker
    restart: unless-stopped
    command: celery -A src.celery_app worker --loglevel=info --concurrency=2
    working_dir: /app
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: aviation123
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      REDIS_URL: redis://redis:6379/0
      LANGFUSE_HOST: http://langfuse:3000
      APP_VERSION: 1.0.0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_PUBLIC_URL: https://cps.comac.cc/storage
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      app-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - snapshots_data:/app/snapshots

  # ── 前端 ──────────────────────────────────
  frontend:
    build: ./frontend
    container_name: aviation-frontend
    restart: unless-stopped
    # 生产环境不对外暴露端口，由 nginx 代理
    expose:
      - "3000"
    environment:
      NEXTAUTH_URL: https://cps.comac.cc
      NODE_ENV: production
    depends_on:
      - backend

  # ── Langfuse NEXTAUTH_URL 生产覆盖 ────────
  langfuse:
    environment:
      NEXTAUTH_URL: https://langfuse.cps.comac.cc

volumes:
  uploads_data:
  snapshots_data:
