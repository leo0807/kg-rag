image:
  backend:
    repository: ghcr.io/your-org/kg-rag-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/your-org/kg-rag-frontend
    tag: "latest"
    pullPolicy: IfNotPresent

replicaCount:
  backend: 2
  frontend: 2

resources:
  backend:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  frontend:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

service:
  backend:
    type: ClusterIP
    port: 8000
  frontend:
    type: ClusterIP
    port: 3000

ingress:
  enabled: false
  host: kg-rag.example.com
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: false
    secretName: kg-rag-tls

# Non-secret env vars — injected via ConfigMap.
# Secrets (passwords, keys) must be provided via external Secret.
env:
  DATABASE_URL: ""
  NEO4J_URI: ""
  REDIS_URL: ""
  MINIO_ENDPOINT: ""
  ELASTICSEARCH_URL: ""
  APP_ENV: "production"
  LOG_LEVEL: "INFO"

# Name of the K8s Secret that holds sensitive values (created by secret.yaml).
# Override each key at deploy time; NEVER commit real values here.
externalSecretName: "kg-rag-secrets"

secrets:
  DATABASE_PASSWORD: ""
  NEO4J_PASSWORD: ""
  REDIS_PASSWORD: ""
  JWT_SECRET: ""
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
