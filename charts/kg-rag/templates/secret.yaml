# This template creates a placeholder Secret so `helm install --dry-run` succeeds
# in CI without real values. In production, supply actual values via:
#
#   helm install kg-rag ./charts/kg-rag \
#     --set-string "secrets.DATABASE_PASSWORD=..." \
#     --set-string "secrets.NEO4J_PASSWORD=..."
#
# Or, skip this template entirely and create the Secret externally (e.g. via
# Sealed Secrets / External Secrets Operator), then set:
#   externalSecretName: <your-pre-existing-secret>
#
# NEVER commit real secret values into values.yaml or this chart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.externalSecretName }}
  labels:
    {{- include "kg-rag.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Override each key at deploy time; defaults are intentionally empty.
  DATABASE_PASSWORD:  {{ .Values.secrets.DATABASE_PASSWORD | default "" | quote }}
  NEO4J_PASSWORD:     {{ .Values.secrets.NEO4J_PASSWORD | default "" | quote }}
  REDIS_PASSWORD:     {{ .Values.secrets.REDIS_PASSWORD | default "" | quote }}
  JWT_SECRET:         {{ .Values.secrets.JWT_SECRET | default "" | quote }}
  MINIO_ACCESS_KEY:   {{ .Values.secrets.MINIO_ACCESS_KEY | default "" | quote }}
  MINIO_SECRET_KEY:   {{ .Values.secrets.MINIO_SECRET_KEY | default "" | quote }}
