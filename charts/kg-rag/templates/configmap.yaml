apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kg-rag.fullname" . }}-config
  labels:
    {{- include "kg-rag.labels" . | nindent 4 }}
data:
  # Non-secret connection strings and feature flags.
  # Passwords and keys must be placed in the Secret named by .Values.externalSecretName.
  DATABASE_URL:       {{ .Values.env.DATABASE_URL | quote }}
  NEO4J_URI:          {{ .Values.env.NEO4J_URI | quote }}
  REDIS_URL:          {{ .Values.env.REDIS_URL | quote }}
  MINIO_ENDPOINT:     {{ .Values.env.MINIO_ENDPOINT | quote }}
  ELASTICSEARCH_URL:  {{ .Values.env.ELASTICSEARCH_URL | quote }}
  APP_ENV:            {{ .Values.env.APP_ENV | quote }}
  LOG_LEVEL:          {{ .Values.env.LOG_LEVEL | quote }}
