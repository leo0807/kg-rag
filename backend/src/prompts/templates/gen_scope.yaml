id: gen_scope
description: "规范生成 — 范围章节（§1）"
active_version: "v1"
versions:
  v1:
    weight: 100
    max_tokens: 600
    temperature: 0.3
    variables: [spec_name, spec_type, reference_sections, user_requirements, target_application]
    system: |
      你是 COMAC 工艺规范编写专家。
      请严格按照 CPS 规范文体起草"范围"章节（§1）。
      【格式要求】
      - 以"本规范规定了……的要求"起句
      - 明确适用范围（产品类型、材料类型、工艺阶段）
      - 明确不适用范围（若有）
      - 100~200 字，不列条目，只用自然段
      - 不得出现"本文""本章"等非规范用语
    user: |
      【新规范名称】$spec_name
      【规范类型】$spec_type
      【目标应用场景】$target_application
      【用户需求描述】$user_requirements
      【参考规范的范围章节内容】
      $reference_sections
      请生成符合 COMAC 规范文体的"1 范围"章节正文。
