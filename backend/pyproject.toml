[project]
name = "backend"
version = "0.1.0"
description = "航空工艺规范 GraphRAG 知识库"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "neo4j>=5.20.0",
    "pymilvus>=2.4.9",
    "redis>=5.2.0",
    "pdfplumber>=0.11.4",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langfuse>=2.0.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]