version: "3.9"

# ─────────────────────────────────────────────────────────────
# 基础设施层 —— 开发 / 生产共用
# 启动开发环境：bash scripts/dev.sh
# 启动生产环境：bash scripts/prod.sh
# 启动测试环境：docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
# ─────────────────────────────────────────────────────────────

# 统一日志轮转配置（所有服务复用）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "10"

services:
  # ── Langfuse 依赖：PostgreSQL ─────────────
  langfuse-db:
    image: postgres:15
    container_name: aviation-langfuse-db
    logging: *default-logging
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse123
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U langfuse" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Langfuse LLMOps 可观测性平台 ──────────
  langfuse:
    image: langfuse/langfuse:2
    container_name: aviation-langfuse
    logging: *default-logging
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse123@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: aviation-langfuse-secret-key
      NEXTAUTH_URL: http://localhost:3001
      SALT: aviation-salt-key
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    depends_on:
      langfuse-db:
        condition: service_healthy

  # ── Redis（Celery 任务队列 + 缓存）────────
  redis:
    image: redis:7-alpine
    container_name: aviation-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --appendfsync everysec --requirepass ${REDIS_PASSWORD:-aviation_redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aviation_redis_secret}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j 图数据库 ────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: aviation-neo4j
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/aviation123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD", "neo4j", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Milvus 依赖：etcd（元数据存储）────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: aviation-etcd
    restart: unless-stopped
    logging: *default-logging
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: >
      etcd --advertise-client-urls=http://etcd:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO 对象存储（Milvus 内部 + 应用文件存储共用）──
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: aviation-minio
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Milvus 向量数据库 ──────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.9
    container_name: aviation-milvus
    restart: unless-stopped
    logging: *default-logging
    command: [ "milvus", "run", "standalone" ]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Attu：Milvus 的网页管理界面 ───────────
  attu:
    image: zilliz/attu:v2.4
    container_name: aviation-attu
    ports:
      - "8080:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      - milvus

  # ── 应用数据库（用户、配置、审计）────────
  app-db:
    image: postgres:15
    container_name: aviation-app-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: aviation
      POSTGRES_PASSWORD: aviation123
      POSTGRES_DB: aviation
    volumes:
      - app_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aviation" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Celery Worker（F117: ingest 异步化）──────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aviation-celery-worker
    restart: unless-stopped
    command: celery -A src.celery_app worker --loglevel=info --concurrency=2
    working_dir: /app
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-aviation_redis_secret}@redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: aviation123
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      DATABASE_URL: postgresql+asyncpg://aviation:aviation123@app-db:5432/aviation
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_PUBLIC_URL: http://localhost:9000
      ES_URL: http://elastic:${ES_PASSWORD:-aviation_es_secret}@elasticsearch:9200
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      app-db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads

  # ── Elasticsearch ────────────────────────
  elasticsearch:
    build:
      context: ./docker/elasticsearch
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: aviation-es
    restart: unless-stopped
    logging: *default-logging
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD:-aviation_es_secret}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "-u", "elastic:${ES_PASSWORD:-aviation_es_secret}", "http://localhost:9200" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Kibana（ES 可视化）───────────────────
  kibana:
    image: kibana:8.7.0
    platform: linux/amd64
    container_name: aviation-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ES_PASSWORD:-aviation_es_secret}
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
  langfuse_db_data:
  redis_data:
  app_db_data:
  es_data:
