version: "3.9"

# ─────────────────────────────────────────────────────────────
# 开发覆盖层
# 用法：bash scripts/dev.sh
#   等价于：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# backend 在容器中运行，挂载 src/ 支持热重载（LibreOffice 自动可用）
# frontend 仍在本地运行：cd frontend && npm run dev
# ─────────────────────────────────────────────────────────────

services:
  # ── 后端（容器内热重载）────────────────────
  backend:
    build: ./backend
    container_name: aviation-backend
    restart: "no"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: aviation123
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      REDIS_URL: redis://redis:6379/0
      LANGFUSE_HOST: http://langfuse:3000
      APP_VERSION: dev
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_PUBLIC_URL: http://localhost:9000
      DATABASE_URL: postgresql+asyncpg://aviation:aviation123@app-db:5432/aviation
      ES_URL: http://elasticsearch:9200
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src          # 热重载：修改代码立即生效
      - ./backend/scripts:/app/scripts  # 便于在容器内执行运维脚本
      - ./backend/models:/app/models    # BGE-M3 本地 Embedding 模型
      - uploads_dev:/app/uploads
      - snapshots_dev:/app/snapshots
    command: >
      uvicorn src.main:app
        --reload
        --reload-dir /app/src
        --host 0.0.0.0
        --port 8000

  # ── 开发机内存充足，放宽 Neo4j 堆内存限制 ──
  neo4j:
    environment:
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
    restart: "no"

  redis:
    restart: "no"

  etcd:
    restart: "no"

  minio:
    restart: "no"

  milvus:
    restart: "no"

  attu:
    restart: "no"

  langfuse-db:
    restart: "no"

  langfuse:
    restart: "no"

  app-db:
    restart: "no"

  elasticsearch:
    restart: "no"

  kibana:
    restart: "no"

volumes:
  uploads_dev:
  snapshots_dev:
