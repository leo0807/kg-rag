# Streaming overlay: Kafka (KRaft) + Debezium Connect + ClickHouse + Flink
# Usage: docker compose -f docker-compose.yml -f docker-compose.streaming.yml up -d
#
# Ports added (no conflicts with base compose):
#   9092  Kafka broker
#   8083  Debezium Connect REST
#   8123  ClickHouse HTTP
#   9100  ClickHouse native TCP (remapped; base uses 9000/9001 for MinIO)
#   8082  Flink Web UI

version: "3.9"

x-logging: &logging
  driver: "json-file"
  options: { max-size: "10m", max-file: "3" }

services:
  # ── Kafka (KRaft mode, no ZooKeeper) ─────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: aviation-kafka
    restart: unless-stopped
    logging: *logging
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LOG_RETENTION_HOURS: "168"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Debezium PostgreSQL Connector ─────────────────────────────────────────
  debezium-connect:
    image: debezium/connect:2.7
    container_name: aviation-debezium
    restart: unless-stopped
    logging: *logging
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "debezium-cg-1"
      CONFIG_STORAGE_TOPIC: "_debezium.configs"
      OFFSET_STORAGE_TOPIC: "_debezium.offsets"
      STATUS_STORAGE_TOPIC: "_debezium.status"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: "debezium-connect"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ── ClickHouse (OLAP, sub-second dashboards) ──────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.4
    container_name: aviation-clickhouse
    restart: unless-stopped
    logging: *logging
    ports:
      - "8123:8123"
      - "9100:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flink JobManager ──────────────────────────────────────────────────────
  flink-jobmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: aviation-flink-jm
    restart: unless-stopped
    logging: *logging
    command: jobmanager
    ports:
      - "8082:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        heartbeat.interval: 10000
        heartbeat.timeout: 50000
    volumes:
      - ./flink_jobs:/opt/flink/jobs:ro
      - flink_checkpoints:/tmp/flink-checkpoints

  # ── Flink TaskManager ─────────────────────────────────────────────────────
  flink-taskmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: aviation-flink-tm
    restart: unless-stopped
    logging: *logging
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./flink_jobs:/opt/flink/jobs:ro
      - flink_checkpoints:/tmp/flink-checkpoints

volumes:
  kafka_data:
  clickhouse_data:
  flink_checkpoints:
