# nginx/nginx.conf — cps.comac.cc 生产环境配置
#
# 域名规划：
#   cps.comac.cc            → 主应用（前端 + 后端 API）
#   langfuse.cps.comac.cc   → Langfuse LLMOps 可观测性（仅内网）
#
# 证书路径（两种方式二选一）：
#   手动证书：/etc/nginx/certs/server.crt + server.key
#   Let's Encrypt：替换为 /etc/letsencrypt/live/cps.comac.cc/fullchain.pem + privkey.pem

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # 性能
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_comp_level    5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff2;

    # TLS 全局配置
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout          5s;

    # 安全响应头（所有 server 生效）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

    server_tokens        off;
    client_max_body_size 500m;

    # ────────────────────────────────────────────────────────────
    # HTTP → HTTPS 跳转（所有域名）
    # ────────────────────────────────────────────────────────────
    server {
        listen      80;
        listen      [::]:80;
        server_name cps.comac.cc langfuse.cps.comac.cc;

        # Let's Encrypt ACME 验证（使用 certbot 签证时放开）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ────────────────────────────────────────────────────────────
    # 主应用：cps.comac.cc
    # ────────────────────────────────────────────────────────────
    server {
        listen      443 ssl http2;
        listen      [::]:443 ssl http2;
        server_name cps.comac.cc;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        # Let's Encrypt 路径：
        # ssl_certificate     /etc/letsencrypt/live/cps.comac.cc/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/cps.comac.cc/privkey.pem;

        add_header Content-Security-Policy
            "default-src 'self'; \
             script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
             style-src 'self' 'unsafe-inline'; \
             img-src 'self' data: blob: https:; \
             connect-src 'self' wss://cps.comac.cc https://langfuse.cps.comac.cc; \
             worker-src blob:; \
             frame-ancestors 'none';" always;

        # ── WebSocket：实时监控 / 导入进度推送 ──
        location ~ ^/api/(realtime|ingest/ws)/ {
            proxy_pass          http://backend:8000;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_set_header    X-Real-IP  $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── SSE：流式问答输出 ────────────────────
        location ~ ^/api/query/stream {
            proxy_pass          http://backend:8000;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            proxy_set_header    Host       $host;
            proxy_set_header    X-Real-IP  $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
            add_header          Cache-Control    "no-cache";
            add_header          X-Accel-Buffering "no";
        }

        # ── 后端 API（常规 HTTP）────────────────
        location /api/ {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── FastAPI 接口文档 ─────────────────────
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── 前端 Next.js（所有其他路径）────────
        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ────────────────────────────────────────────────────────────
    # Langfuse 可观测性：langfuse.cps.comac.cc
    # 默认仅限内网 IP 访问，VPN 或跳板机可达
    # ────────────────────────────────────────────────────────────
    server {
        listen      443 ssl http2;
        listen      [::]:443 ssl http2;
        server_name langfuse.cps.comac.cc;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        # Let's Encrypt 通配符证书路径：
        # ssl_certificate     /etc/letsencrypt/live/cps.comac.cc/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/cps.comac.cc/privkey.pem;

        # 仅允许内网访问（按实际内网段修改）
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;

        location / {
            proxy_pass         http://langfuse:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
